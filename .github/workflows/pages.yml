name: Deploy board to GitHub Pages

# House pipe for the Michigan Money Saver board (owner order, Nov 12, 2026):
# the board's code is house property in this repo, so the board builds and
# deploys from GitHub Actions to GitHub Pages. The legacy Manus build stands
# untouched as fallback until the owner retires it himself.

on:
  push:
    branches: ["unified/main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the board
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the client (static board + barter house)
        run: pnpm exec vite build --base=/michigan-money-saver/

      - name: SPA fallback for deep links
        run: cp dist/public/index.html dist/public/404.html

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
